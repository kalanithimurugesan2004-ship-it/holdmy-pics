<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe9ff"/>
      <stop offset="1" stop-color="#e4d7fb"/>
    </linearGradient>
    <linearGradient id="ph1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a8b"/>
      <stop offset="1" stop-color="#ff6a88"/>
    </linearGradient>
    <linearGradient id="ph2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f7fd5"/>
      <stop offset="1" stop-color="#86a8e7"/>
    </linearGradient>
    <linearGradient id="ph3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43e97b"/>
      <stop offset="1" stop-color="#38f9d7"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#3a2560" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="640" height="800" fill="url(#bg)"/>

  <!-- sticker polaroid 1 -->
  <g filter="url(#sh)" transform="rotate(-9 210 300)">
    <rect x="90" y="150" width="240" height="300" rx="14" fill="#ffffff"/>
    <rect x="90" y="150" width="240" height="300" rx="14" fill="none" stroke="#c9b8f0" stroke-width="3" stroke-dasharray="10 8"/>
    <rect x="112" y="172" width="196" height="196" rx="6" fill="url(#ph1)"/>
    <circle cx="160" cy="222" r="22" fill="#ffffff" opacity="0.65"/>
    <path d="M122 358 l50 -46 34 28 40 -50 40 68 z" fill="#ffffff" opacity="0.55"/>
    <text x="210" y="420" font-family="Georgia, serif" font-size="26" fill="#6d5aa8" text-anchor="middle" font-style="italic">memories</text>
  </g>

  <!-- sticker polaroid 2 -->
  <g filter="url(#sh)" transform="rotate(7 430 470)">
    <rect x="310" y="330" width="230" height="288" rx="14" fill="#ffffff"/>
    <rect x="310" y="330" width="230" height="288" rx="14" fill="none" stroke="#c9b8f0" stroke-width="3" stroke-dasharray="10 8"/>
    <rect x="331" y="351" width="188" height="188" rx="6" fill="url(#ph2)"/>
    <circle cx="378" cy="399" r="20" fill="#ffffff" opacity="0.6"/>
    <path d="M341 528 l46 -44 32 26 40 -46 40 64 z" fill="#ffffff" opacity="0.5"/>
    <text x="425" y="588" font-family="Georgia, serif" font-size="24" fill="#5b6bb0" text-anchor="middle" font-style="italic">forever</text>
  </g>

  <!-- small peel-corner sticker 3 -->
  <g filter="url(#sh)" transform="rotate(-4 300 640)">
    <rect x="220" y="560" width="150" height="186" rx="12" fill="#ffffff"/>
    <rect x="220" y="560" width="150" height="186" rx="12" fill="none" stroke="#c9b8f0" stroke-width="2.5" stroke-dasharray="8 6"/>
    <rect x="236" y="576" width="118" height="118" rx="5" fill="url(#ph3)"/>
    <path d="M354 694 q22 8 16 34 -26 6 -34 -16 z" fill="#efe4ff"/>
  </g>

  <!-- label chip -->
  <g transform="translate(320 70)">
    <rect x="-118" y="-26" width="236" height="52" rx="26" fill="#3a2560"/>
    <text x="0" y="7" font-family="Georgia, serif" font-size="24" letter-spacing="3" fill="#f5ead9" text-anchor="middle">STICKER POLAROIDS</text>
  </g>
</svg>
